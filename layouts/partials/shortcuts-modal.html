<div class="shortcuts-modal-backdrop" id="shortcuts-modal" aria-hidden="true" role="dialog" aria-label="Keyboard Shortcuts">
  <div class="shortcuts-modal-card">
    <div class="shortcuts-modal-header">
      <span class="shortcuts-title">
        <span class="cmd-prompt">❯</span> shortcuts --help
      </span>
      <button class="shortcuts-close-btn" id="shortcuts-close-btn" aria-label="Close shortcuts help">esc</button>
    </div>
    <div class="shortcuts-modal-body">
      <div class="shortcuts-grid">
        <div class="shortcut-row">
          <span class="shortcut-keys"><kbd>/</kbd> <span class="shortcut-or">or</span> <kbd>Ctrl</kbd><kbd>K</kbd></span>
          <span class="shortcut-desc">Search posts</span>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-keys"><kbd>↓</kbd> <kbd>↑</kbd> <span class="shortcut-or">or</span> <kbd>j</kbd> <kbd>k</kbd></span>
          <span class="shortcut-desc">Navigate list / TOC</span>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-keys"><kbd>Enter</kbd></span>
          <span class="shortcut-desc">Open selected item</span>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-keys"><kbd>t</kbd></span>
          <span class="shortcut-desc">Toggle Table of Contents</span>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-keys"><kbd>g</kbd><kbd>g</kbd> <span class="shortcut-or">/</span> <kbd>G</kbd></span>
          <span class="shortcut-desc">Scroll to top / bottom</span>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-keys"><kbd>?</kbd></span>
          <span class="shortcut-desc">Toggle this helper</span>
        </div>
        <div class="shortcut-row">
          <span class="shortcut-keys"><kbd>Esc</kbd></span>
          <span class="shortcut-desc">Close / reset search</span>
        </div>
      </div>
    </div>
  </div>
</div>
